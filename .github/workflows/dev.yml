name: CMS-BOSS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, dev-cms]

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node Modules
        run: npm install --legacy-peer-deps
    
      - run: rm package-lock.json

      - run: cp .env.example .env
      - run: npm run build
      - name: run pm2
        run: | 
          pm2 reload photocontest_cms || pm2 start npm --name photocontest_cms -- run start

      # - run: pm2 start CMS
